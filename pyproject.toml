[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campie-anonymous"
version = "0.4.0"
description = "Anonymous core implementation of CAMP-IE conditioner, stable head localization, and CIS fitting"
requires-python = ">=3.10"
dependencies = [
  "diffusers>=0.35.1",
  "torch>=2.4",
  "transformers>=4.51",
  "accelerate>=1.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "Pillow>=10.0",
  "safetensors>=0.4",
  "scikit-learn>=1.4",
]

[tool.setuptools]
packages = ["campie"]
